[workspace]
resolver = "2"
members = [
    "crates/compile-core",
    "crates/compile-cli",
    "crates/compile-bench",
    "bindings/c",
    "bindings/python",
    "bindings/node",
    "bindings/wasm",
    "examples/rust",
]
# The fuzz crate is its own (detached) workspace — cargo-fuzz builds it on a
# nightly toolchain with sanitizer flags.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra-compile"
authors = ["wickra-lib"]

[workspace.dependencies]
# Workspace-internal crate, referenced by the CLI, bench, example and bindings.
wickra-compile-core = { version = "0.1.3", path = "crates/compile-core" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parser is fast and may be a ULP
# off, so a number printed by the canonicaliser could re-parse to a neighbour
# and print differently -- the fuzzer found "-9.299999999999999e+30" coming
# back as "-9.3e+30". The canonical hash is only a hash of the logical spec if
# the text round-trips exactly.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
sha2 = "0.11"
handlebars = "6"
clap = { version = "4", features = ["derive"] }
# The engine the compiler validates a StrategySpec against, from crates.io and
# pinned exactly, as the released siblings pin it: a newer patch on one side
# must not leave two copies of the engine in one graph.
wickra-backtest = "=0.1.7"
cbindgen = "0.27"
# codspeed-criterion-compat is a drop-in for criterion: the benches keep their
# criterion API and run as criterion locally, but under `cargo codspeed` they
# report measurements instead of merely executing. Without the alias the
# CodSpeed job runs the benchmarks and uploads nothing, which reads as a pass.
criterion = { package = "codspeed-criterion-compat", version = "5.0.1" }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
